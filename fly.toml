# Fly.io app config — deploy: flyctl deploy (from repo root)
app = '241runners-api'
primary_region = 'iad'

[build]
  dockerfile = '241RunnersAPI/Dockerfile'
  context = '241RunnersAPI'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  DATABASE_PROVIDER = 'Postgres'
  STORAGE_PROVIDER = 'Supabase'
  JWT_ISSUER = '241RunnersAwareness'
  JWT_AUDIENCE = '241RunnersAwareness'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
